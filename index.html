<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>Atlas AI</title>
    <meta name="description" content="Atlas AI: think further, do more. Your intelligent assistant for thinking, creating and discovering." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ffffff" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#111213" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Atlas AI" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <script>
      // Apply theme before first paint to avoid a flash.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('tessera.appearance') || '{}');
          var dark = s.theme === 'dark' || ((!s.theme || s.theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
          var r = document.documentElement;
          if (dark) r.classList.add('dark');
          r.dataset.accent = s.accent || 'teal';
        } catch (e) {
          document.documentElement.dataset.accent = 'teal';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>Atlas AI needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
