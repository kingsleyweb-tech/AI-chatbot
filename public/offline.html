<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Tessera · Offline</title>
    <style>
      :root { color-scheme: light dark; --bg:#fff; --fg:#18181b; --muted:#71717a; --accent:#0f766e; }
      @media (prefers-color-scheme: dark) { :root { --bg:#111213; --fg:#f4f4f5; --muted:#a1a1aa; --accent:#2dd4bf; } }
      html,body { height:100%; margin:0; }
      body { background:var(--bg); color:var(--fg); font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
             display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; text-align:center; }
      h1 { font-size:20px; margin:16px 0 6px; } p { color:var(--muted); margin:0 0 20px; }
      button { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:10px 18px; font:inherit; font-weight:600; }
    </style>
  </head>
  <body>
    <main>
      <svg width="40" height="40" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="3" y="3" width="12" height="12" rx="3.2" fill="currentColor"/>
        <rect x="17" y="3" width="12" height="12" rx="3.2" fill="currentColor" opacity=".35"/>
        <rect x="3" y="17" width="12" height="12" rx="3.2" fill="currentColor" opacity=".35"/>
        <rect x="18.5" y="18.5" width="11" height="11" rx="3" fill="var(--accent)"/>
      </svg>
      <h1>You're offline</h1>
      <p>Tessera needs a connection to load. Reconnect and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
