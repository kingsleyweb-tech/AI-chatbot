<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Atlas AI · Offline</title>
    <style>
      :root { color-scheme: light dark; --bg:#fff; --fg:#18181b; --muted:#71717a; --accent:#0f766e; }
      @media (prefers-color-scheme: dark) { :root { --bg:#111213; --fg:#f4f4f5; --muted:#a1a1aa; --accent:#2dd4bf; } }
      html,body { height:100%; margin:0; }
      body { background:var(--bg); color:var(--fg); font:15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
             display:flex; align-items:center; justify-content:center; padding:24px; box-sizing:border-box; text-align:center; }
      h1 { font-size:20px; margin:16px 0 6px; } p { color:var(--muted); margin:0 0 20px; }
      button { background:var(--accent); color:#fff; border:0; border-radius:10px; padding:10px 18px; font:inherit; font-weight:600; }
    </style>
  </head>
  <body>
    <main>
      <svg width="44" height="44" viewBox="0 0 32 32" aria-hidden="true">
        <rect x="1" y="1" width="30" height="30" rx="8.5" fill="var(--accent)"/>
        <path d="M9.2 24 16 8.2 22.8 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M6.6 19.4c5.2-3.1 13.6-3.1 18.8 0" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" opacity=".75"/>
      </svg>
      <h1>You're offline</h1>
      <p>Atlas AI needs a connection to load. Reconnect and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
